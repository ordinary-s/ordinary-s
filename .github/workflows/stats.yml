name: Generate GitHub Stats

on:
  schedule:
    - cron: "57 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-main-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&theme=default&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&theme=github_dark&disable_animations=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate light languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=default&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=github_dark&disable_animations=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated cards
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          for file in profile/stats.svg profile/stats-dark.svg profile/top-langs.svg profile/top-langs-dark.svg; do
            test -s "$file"
            if grep -Eqi 'something went wrong|could not fetch|bad credentials' "$file"; then
              echo "Error card detected: $file"
              exit 1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/*.svg
          if git diff --cached --quiet; then
            echo "Stats cards are unchanged."
            exit 0
          fi
          git commit -m "chore: update GitHub stats cards"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
